name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build office-viewer demo
        working-directory: office-web
        run: |
          # 本地 node_modules 是指向 ai-ppt/web/node_modules 的软链（CI 中目标不存在）
          rm -rf node_modules
          npm install
          npm run build:demo
      # 读取 Pages 站点元数据。站点从未启用时此步会失败——允许失败继续：
      # 首次启用（Settings → Pages → Source 选 GitHub Actions）后的运行即可部署
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: office-web/dist-demo

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
