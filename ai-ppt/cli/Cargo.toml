[package]
name = "json2pptx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command line tool for json2pptx: JSON to PPTX bidirectional conversion"
repository = "https://github.com/json2pptx/json2pptx"
readme = "../README.md"
keywords = ["pptx", "powerpoint", "json", "ooxml", "cli"]
categories = ["command-line-utilities", "parser-implementations"]

[[bin]]
name = "json2pptx"
path = "src/main.rs"

[dependencies]
json2pptx = { path = ".." }
office-core = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
resvg = { workspace = true }
base64 = { workspace = true }
tiny_http = { workspace = true }

[lints]
workspace = true
