[package]
name = "astorm-office-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "astorm-office 统一 CLI：按格式（word/excel/ppt/pdf）分发到 json2docx/json2xlsx/json2pptx/json2pdf，并支持批量执行"
keywords = ["office", "docx", "xlsx", "pptx", "pdf", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "astorm-office"
path = "src/main.rs"

[dependencies]
office-core = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
